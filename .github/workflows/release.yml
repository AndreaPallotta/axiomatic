name: Release & Container Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: axiomatic
            archive: axiomatic-x86_64-linux.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: axiomatic
            archive: axiomatic-x86_64-macos.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: axiomatic
            archive: axiomatic-aarch64-macos.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: axiomatic.exe
            archive: axiomatic-x86_64-windows.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build target binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix Archive
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.bin_name }} README.md LICENSE models/checkpoint_baseline.json

      - name: Package Windows Archive
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }}, README.md, LICENSE, models/checkpoint_baseline.json -DestinationPath ${{ matrix.archive }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            models/checkpoint_baseline.json
          generate_release_notes: true

  publish-docker:
    name: Publish Container Image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
