[package]
name = "axiomatic"
version = "0.1.0"
edition = "2021"
authors = ["Andrea Pallotta"]
description = "Autonomous Neurosymbolic Mathematical Discovery Engine with Real-Time Graphical Visualizer"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rayon = "1.10"
parking_lot = "0.12"
chrono = "0.4"
